name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets JSR mint a short-lived token for this run through GitHub's OIDC provider,
      # so no registry secret is stored. JSR checks that the claim names this repository,
      # which is why each package must be linked to it in its JSR settings.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("packages/steamworks/deno.json")).version)')
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $pkg in packages/steamworks/deno.json"
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Type check
        run: deno task check

      - name: Lint and format
        run: deno task lint

      - name: Test
        run: deno task test

      # Each package publishes independently. A flaky failure in one must not stop the
      # other: publishing @steamworks/deno@0.2.0 succeeded but its provenance step failed,
      # the CLI reported an error, and @steamworks/codegen was never published at all.
      - name: Publish @steamworks/deno
        id: publish_deno
        continue-on-error: true
        run: deno publish
        working-directory: packages/steamworks

      # The generator is published so users can regenerate for a different SDK version.
      # It is skipped until the package exists on JSR, since OIDC cannot create one.
      - name: Does @steamworks/codegen exist on JSR?
        id: codegen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://jsr.io/api/scopes/steamworks/packages/codegen)
          echo "exists=$([ "$code" = "200" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Publish @steamworks/codegen
        id: publish_codegen
        continue-on-error: true
        if: steps.codegen.outputs.exists == 'yes'
        run: deno publish
        working-directory: packages/codegen

      # Confirm against the registry rather than trusting the CLI's exit code, which has
      # reported failure after a successful upload.
      - name: Confirm both packages are on JSR at this version
        run: |
          version=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("packages/steamworks/deno.json")).version)')
          failed=0
          for pkg in deno codegen; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://jsr.io/api/scopes/steamworks/packages/$pkg/versions/$version")
            if [ "$code" = "200" ]; then
              echo "ok    @steamworks/$pkg@$version is published"
            else
              echo "FAIL  @steamworks/$pkg@$version is missing (HTTP $code)"
              failed=1
            fi
          done
          exit $failed
