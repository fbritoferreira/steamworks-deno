name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Lets JSR mint a short-lived token for this run through GitHub's OIDC provider,
      # so no registry secret is stored. JSR checks that the claim names this repository,
      # which is why each package must be linked to it in its JSR settings.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("packages/steamworks/deno.json")).version)')
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $pkg in packages/steamworks/deno.json"
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Type check
        run: deno task check

      - name: Lint and format
        run: deno task lint

      - name: Test
        run: deno task test

      - name: Publish @steamworks/deno
        run: deno publish
        working-directory: packages/steamworks

      # The generator is published so users can regenerate for a different SDK version.
      # It is skipped until the package exists on JSR, since OIDC cannot create one.
      - name: Does @steamworks/codegen exist on JSR?
        id: codegen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://jsr.io/api/scopes/steamworks/packages/codegen)
          echo "exists=$([ "$code" = "200" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Publish @steamworks/codegen
        if: steps.codegen.outputs.exists == 'yes'
        run: deno publish
        working-directory: packages/codegen
